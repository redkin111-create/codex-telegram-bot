name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/codex-mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/codex-mobile
      - run: node --check apps/mini-app/public/app.js
      - run: npm run typecheck
      - run: npm run build --prefix apps/codex-mobile
      - run: npm test
